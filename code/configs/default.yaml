# VIBench — shared runner defaults

benchmark: vibench

sampling:
  temperature: null
  max_tokens: null
  top_p: null
  reasoning_effort: null
  reasoning_effort_by_model: {}
  reasoning_effort_policy: supported_only

completions: 3
rate_limit_delay: 0.5

modalities:
  - nli
  - fim
  - reference_open

models: all
scenarios: all

paths:
  datasets: benchmark
  outputs: outputs/raw
  system_prompt: system_prompt.txt
  models_file: models.json
  env_file: configs/.env

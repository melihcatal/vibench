# R2 option-order ablation for the primary OpenCode agent runtime:
# affiliated provider/ecosystem shown first.
#
# 4 affiliated models x 20 workflows x informed variant x 3 completions
# = 216 expected OpenCode agent sessions.

name: agentic/ablations/option_order/opencode/affiliated_first_3c
benchmark: vibench
type: agentic
system_prompt_file: agentic_system_prompt.txt
option_order_mode: affiliated_first
tasks: all

variants:
  - informed

completions: 3
timeout: 1200
max_workers: 4
max_consecutive_errors: 20

sampling:
  temperature: null
  max_tokens: null
  top_p: null
  opencode_variant: null
  opencode_variant_policy: supported_only
  opencode_variant_by_model:
    gpt-5.4-mini: none

models:
  - gemini-2.5-flash
  - nova-pro
  - gpt-5.4-mini
  - granite-4.0-h-small

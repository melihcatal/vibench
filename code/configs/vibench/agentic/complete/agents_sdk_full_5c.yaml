# Controlled VIBench agentic run config using OpenAI Agents SDK + LiteLLM.
#
# 10 models × 18 workflows × 2 variants × 5 completions
# = 1,800 expected agent sessions.
#
# Routes calls through LiteLLM and writes files via an explicit write_file tool.

name: agentic/complete/agents_sdk_full_5c
benchmark: vibench
type: agentic_litellm_agents
system_prompt_file: agentic_system_prompt.txt
tasks: all

variants:
  - free
  - informed

completions: 5
timeout: 600
max_turns: 30
max_workers: 10
max_consecutive_errors: 5
rate_limit_delay: 1.0
rate_limit_delay_per_model:
  nova-pro: 2.0
  gemini-2.5-pro: 2.0
  gemini-2.5-flash: 1.0
  qwen3.6-plus: 1.0
  gpt-5.4: 1.0
  gpt-5.4-mini: 1.0
  mistral-large-3: 10.0
  deepseek-v3.2: 1.0
  grok-4-1-fast-reasoning: 1.0
  granite-4.0-h-small: 2.0

sampling:
  temperature: null
  max_tokens: null
  top_p: null
  parallel_tool_calls: null
  tool_choice: null
  reasoning_effort: null
  reasoning_effort_policy: supported_only
  reasoning_effort_by_model:
    gpt-5.4: none
    gpt-5.4-mini: none

models:
  - nova-pro
  - gemini-2.5-pro
  - gemini-2.5-flash
  - qwen3.6-plus
  - gpt-5.4
  - gpt-5.4-mini
  - mistral-large-3
# - deepseek-v3.2
  - grok-4-1-fast-reasoning
  - granite-4.0-h-small

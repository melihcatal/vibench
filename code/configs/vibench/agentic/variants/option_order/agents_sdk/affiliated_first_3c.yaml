# R2 option-order ablation: affiliated provider/ecosystem shown first.
#
# 4 affiliated models × 20 workflows × informed variant × 3 completions
# = 240 expected agent sessions.

name: agentic/variants/option_order/agents_sdk/affiliated_first_3c
benchmark: vibench
type: agentic_litellm_agents
system_prompt_file: agentic_system_prompt.txt
option_order_mode: affiliated_first
tasks: all

variants:
  - informed

completions: 3
timeout: 600
max_turns: 30
max_workers: 4
max_consecutive_errors: 5
rate_limit_delay: 1.0
rate_limit_delay_per_model:
  nova-pro: 10.0
  gemini-2.5-flash: 1.0
  gpt-5.4-mini: 1.0
  granite-4.0-h-small: 2.0

sampling:
  temperature: null
  max_tokens: null
  top_p: null
  parallel_tool_calls: null
  tool_choice: null
  reasoning_effort: null
  reasoning_effort_policy: supported_only
  reasoning_effort_by_model:
    gpt-5.4-mini: none

models:
  - gemini-2.5-flash
  - nova-pro
  - gpt-5.4-mini
  - granite-4.0-h-small

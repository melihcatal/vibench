# R2c provider-list position ablation for direct reference-open:
# place the model-affiliated provider/ecosystem near the middle of reference cards.
#
# 4 affiliated models x 20 scenarios x 4 subtasks x reference_open x 3 completions
# = 960 expected direct generations.

name: direct/variants/option_order/affiliated_middle_3c
benchmark: vibench
dataset_format: hf_jsonl
system_prompt_file: system_prompt.txt
option_order_mode: affiliated_middle

completions: 3
rate_limit_delay: 0.3
rate_limit_delay_per_model:
  nova-pro: 5
  granite-4.0-h-small: 1
max_workers: 4
max_consecutive_errors: 5

sampling:
  temperature: null
  max_tokens: null
  top_p: null
  reasoning_effort: null
  reasoning_effort_policy: supported_only
  reasoning_effort_by_model:
    gpt-5.4-mini: none

modalities:
  - reference_open

models:
  - gemini-2.5-flash
  - nova-pro
  - gpt-5.4-mini
  - granite-4.0-h-small

scenarios: all
